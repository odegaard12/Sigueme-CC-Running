vrrp_script chk_leguas {
    script "/usr/bin/curl -sf -m 3 -o /dev/null http://localhost:8710/live.json"
    interval 5
    timeout 4
    fall 3          # 3 fallos seguidos: un pico de carga no mueve la IP
    rise 2
}

vrrp_instance VI_SIGUEME {
    # BACKUP + nopreempt en las DOS: la IP se queda donde está al volver la
    # otra (si no, volvía con datos viejos y la réplica los copiaba encima)
    state BACKUP
    nopreempt
    interface eth0
    virtual_router_id 53
    priority 101    # 100 en la otra Pi
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CLAVE_VRRP
    }
    virtual_ipaddress {
        IP_FLOTANTE/24
    }
    track_script {
        chk_leguas weight 0   # con nopreempt, bajar la prioridad no suelta la IP: el fallo pasa a FAULT
    }
}
