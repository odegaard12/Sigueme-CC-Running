
# --- la carrera (seguimiento de la carrera): .104 -- RESPALDO ---
#
# Pareja de la instancia VI_SIGUEME de .103. Mismo router id (53) y misma
# clave. Aqui la prioridad es 100: si .103 esta sana se queda ella la VIP
# .202; si su web cae (chk_leguas baja 101 -> 81) o la Pi entera se va, la
# VIP salta aqui. Esta Pi sirve la misma web y su servidor detecta el enlace
# del BSC500 en el live.json replicado y sigue solo con el seguimiento.

vrrp_script chk_leguas {
    script "/usr/bin/curl -sf -m 3 -o /dev/null http://localhost:8710/live.json"
    interval 5
    timeout 4
    fall 3
    rise 2
    weight -20
}

vrrp_instance VI_SIGUEME {
    state BACKUP
    interface eth0
    virtual_router_id 53
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CAMBIAME
    }
    virtual_ipaddress {
        IP_FLOTANTE/24
    }
    track_script {
        chk_leguas
    }
}
