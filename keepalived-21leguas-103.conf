
# --- 21 Leguas (seguimiento de la carrera): .103 -- TITULAR ---
#
# Tercera instancia VRRP sobre el mismo par de Pis. VIP .202, router id 53
# (51 = meteo, 52 = saga). El chequeo pide live.json al propio servidor: si
# el proceso esta muerto la prioridad baja 20 y la VIP se va a .104, que
# sirve la misma web y arranca solo el seguimiento del enlace replicado.

vrrp_script chk_leguas {
    script "/usr/bin/curl -sf -m 3 -o /dev/null http://localhost:8710/live.json"
    interval 5
    timeout 4
    fall 3
    rise 2
    weight -20
}

vrrp_instance VI_21LEGUAS {
    state MASTER
    interface eth0
    virtual_router_id 53
    priority 101
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass CAMBIAME
    }
    virtual_ipaddress {
        192.168.68.202/24
    }
    track_script {
        chk_leguas
    }
}
