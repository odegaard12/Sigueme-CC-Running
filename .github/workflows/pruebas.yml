name: Pruebas del servidor
# En cada cambio: el servidor real en una carpeta limpia, con datos inventados.
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: '3.12' }
      - run: pip install fitdecode==0.11.0
      - name: Lector de GPX (ruido, coma decimal, UTF-16)
        run: python pruebas/gpx.py
      - name: Panel, plan de la app y seguridad del servidor
        run: python pruebas/servidor.py
      - name: Invitados (usuario con caducidad, rutas y GPX para el reloj)
        run: python pruebas/invitados.py
      - name: Ensayo de una carrera entera
        run: python pruebas/ensayo.py
      - name: Resultado del tramo y rutas GPX
        run: |
          python pruebas/resultado_tramo.py
          python pruebas/rutas_gpx.py
      - name: Relojes de cada marca (resultados, ruta y avisos)
        run: python pruebas/relojes.py
      - name: Guía de relojes
        run: python pruebas/guias.py
      - name: Carreras en directo y avisos
        run: |
          python pruebas/directos.py
          python pruebas/avisos_ruta.py
      - name: El móvil del dueño alimenta la carrera principal y la compartida
        run: python pruebas/espejo.py
      - name: Posiciones válidas mientras muchos miran la página del directo
        run: python pruebas/concurrencia.py
      - name: Endurecimiento del servidor
        run: python pruebas/endurecimiento.py
      - name: Carga (60 espectadores a la vez)
        run: python pruebas/carga.py 60
