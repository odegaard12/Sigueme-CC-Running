name: Pruebas del servidor
# En cada cambio: el servidor real en una carpeta limpia, con datos inventados.
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: '3.12' }
      - run: pip install fitdecode
      - name: Lector de GPX (ruido, coma decimal, UTF-16)
        run: python pruebas/gpx.py
      - name: Panel, plan de la app y seguridad del servidor
        run: python pruebas/servidor.py
      - name: Invitados (usuario con caducidad, rutas y GPX para el reloj)
        run: python pruebas/invitados.py
      - name: Ensayo de una carrera entera
        run: python pruebas/ensayo.py
      - name: Carga (60 espectadores a la vez)
        run: python pruebas/carga.py 60
